name: Scheduled Health Check (Web & PostgreSQL)

on:
  schedule:
    # Verifica periodicamente a resposta HTTP e a conectividade com o PostgreSQL.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-health-check
  cancel-in-progress: false

jobs:
  health-check:
    name: HTTP and PostgreSQL connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check application health and database connection
        env:
          HEALTHCHECK_URL: ${{ vars.APP_HEALTHCHECK_URL || 'https://olokuti-web-production.up.railway.app/health?db=1' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 30 "$HEALTHCHECK_URL"
          printf "\nHealth check passed.\n"
