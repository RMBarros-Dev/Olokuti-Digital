name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff, Django Checks, and Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.txt
      - name: Install dependencies
        run: python -m pip install -r requirements/development.txt
      - name: Lint with Ruff
        run: python -m ruff check .
      - name: Django system & migration checks
        run: |
          python manage.py check --settings=config.settings.test
          python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Validate production deploy configuration
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-validation-only-strong-secret-key-0123456789abcdef
          DATABASE_URL: postgresql://ci:ci-pass@127.0.0.1:5432/olokuti
          DJANGO_ALLOWED_HOSTS: olokuti.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://olokuti.example.com
          DJANGO_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.sendgrid.net
          EMAIL_USE_TLS: "true"
          DEFAULT_FROM_EMAIL: no-reply@olokuti.example.com
        run: python manage.py check --deploy --fail-level WARNING
      - name: Run tests with coverage gate (>= 90%)
        run: python -m pytest --cov=apps --cov=config --cov-report=term-missing --cov-fail-under=90
