name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.txt
      - name: Install dependencies
        run: python -m pip install -r requirements/development.txt
      - name: Lint
        run: python -m ruff check .
      - name: Django system checks
        run: python manage.py check --settings=config.settings.test
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Test
        run: python -m pytest -q
